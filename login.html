<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>EcoSignal | Вход</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto+Flex:wght@300;400;600&family=Roboto+Slab:wght@300;400&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body class="register-page">
		<header class="site-header">
			<nav class="navbar header-container">
				<a class="logo" href="index.html">
					<img class="logo-image" src="icons/Group.svg" alt="EcoSignal" />
					EcoSignal
				</a>
				<ul class="nav-links">
					<li><a href="index.html#about">О проекте</a></li>
					<li><a href="index.html#how-it-works">Как это работает</a></li>
					<li><a href="index.html#roles">Для кого</a></li>
					<li><a href="index.html#contacts">Контакты</a></li>
					<li><a href="map.html">Карта</a></li>
				</ul>
				<div class="nav-actions" id="navActions">
					<a class="btn btn-login" href="register.html">Регистрация</a>
				</div>
			</nav>
		</header>

		<main class="register-main">
			<section class="register-layout">
				<section class="register-left">
					<div class="register-inner">
						<h1 class="register-title">Вход</h1>

						<div class="register-card">
							<form id="loginForm" class="register-form" autocomplete="off">
								<input
									id="email"
									name="email"
									type="text"
									autocomplete="off"
									placeholder="Введите email или логин"
								/>
								<input
									id="password"
									name="password"
									type="password"
									autocomplete="new-password"
									placeholder="Введите пароль"
								/>
								<button type="submit" class="submit-btn">Войти</button>
							</form>

							<p id="message"></p>
						</div>
					</div>
				</section>

				<aside class="register-right">
					<img
						class="register-illustration"
						src="imgs/reg_illustration.png"
						alt="Иллюстрация входа"
					/>
				</aside>
			</section>
		</main>

		<script>
			const loginForm = document.getElementById('loginForm')
			const emailInput = document.getElementById('email')
			const passwordInput = document.getElementById('password')
			const navActions = document.getElementById('navActions')

			function getDashboardUrl(user) {
				const userRole = user?.role
				const authSource = user?.auth_source

				if (userRole === 'superadmin' && authSource === 'system_admins') {
					return 'superadmin.html'
				}

				if (userRole === 'global_admin' && authSource === 'system_admins') {
					return 'global_admin.html'
				}

				if (userRole === 'ai_admin' && authSource === 'system_admins') {
					return 'ai_admin.html'
				}

				if (userRole === 'admin' && authSource === 'org_admins') {
					return 'agent.html'
				}

				return 'map.html'
			}

			async function syncHeaderAuthAction() {
				const token = localStorage.getItem('token')
				if (!navActions || !token) return

				try {
					const response = await fetch('api/auth/me', {
						method: 'GET',
						headers: {
							Authorization: `Bearer ${token}`,
						},
					})

					if (!response.ok) {
						localStorage.removeItem('token')
						localStorage.removeItem('user')
						return
					}

					const data = await response.json()
					navActions.innerHTML = `<a class="btn btn-login" href="${getDashboardUrl(data?.user)}">Личный кабинет</a>`
				} catch (error) {
					localStorage.removeItem('token')
					localStorage.removeItem('user')
				}
			}

			syncHeaderAuthAction()

			window.addEventListener('pageshow', () => {
				if (emailInput) emailInput.value = ''
				if (passwordInput) passwordInput.value = ''
			})

			loginForm
				.addEventListener('submit', async event => {
					event.preventDefault()

					const email = emailInput.value.trim()
					const password = passwordInput.value.trim()
					const messageEl = document.getElementById('message')

					try {
						const response = await fetch('api/auth/login', {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json',
							},
							body: JSON.stringify({ email, password }),
						})

						const data = await response.json()

						if (!response.ok) {
							messageEl.textContent = data.message || 'Ошибка входа'
							return
						}

						localStorage.setItem('token', data.token)
						localStorage.setItem('user', JSON.stringify(data.user))

						messageEl.textContent = data.message

						const userRole = data?.user?.role
						const authSource = data?.user?.auth_source
						const nextPage = getDashboardUrl({ role: userRole, auth_source: authSource })
						setTimeout(() => {
							window.location.href = nextPage
						}, 1000)
					} catch (error) {
						messageEl.textContent = 'Ошибка соединения с сервером'
					}
				})
		</script>
	</body>
</html>
