<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSignal | Назначенные админы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@300;400;500;600&family=Roboto+Slab:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="superadmin.css" />
  </head>
  <body>
    <div class="superadmin-page">
      <aside class="super-sidebar" id="superSidebar" aria-label="Боковое меню">
        <div class="super-sidebar__top">
          <div class="super-sidebar__head">
            <button class="super-sidebar__brand" type="button" aria-label="EcoSignal">
              <img class="super-sidebar__brand-icon" src="./icons/Group.svg" alt="" />
              <span class="super-sidebar__brand-name">EcoSignal</span>
            </button>
            <button
              class="super-sidebar__toggle"
              id="superSidebarToggle"
              type="button"
              aria-label="Развернуть панель"
              aria-expanded="false"
            >
              <img src="./icons/aside-slider.svg" alt="" />
            </button>
          </div>

          <nav class="super-sidebar__nav" aria-label="Навигация">
            <button class="super-sidebar__item" type="button" data-href="superadmin.html">
              <img src="./icons/Home.svg" alt="" />
              <span class="super-sidebar__label">Панель</span>
            </button>
            <button
              class="super-sidebar__item super-sidebar__item--active"
              type="button"
              data-href="superadmin_admins.html"
              aria-current="page"
            >
              <img src="./icons/my_appeals.svg" alt="" />
              <span class="super-sidebar__label">Назначенные админы</span>
            </button>
          </nav>
        </div>

        <div class="super-sidebar__bottom">
          <button class="super-sidebar__item super-sidebar__item--logout" type="button" data-action="logout">
            <img src="./icons/logout.svg" alt="" />
            <span class="super-sidebar__label">Выход</span>
          </button>
          <button class="super-sidebar__profile" type="button" aria-label="Профиль">
            <span class="super-sidebar__avatar" id="superSidebarAvatar">S</span>
            <span class="super-sidebar__profile-meta">
              <span class="super-sidebar__profile-name" id="superSidebarName">Профиль</span>
              <span class="super-sidebar__profile-role" id="superSidebarRole">superadmin</span>
            </span>
            <img class="super-sidebar__profile-arrow" src="./icons/arrow_down.svg" aria-hidden="true" />
          </button>
        </div>
      </aside>

      <main class="super-content">
        <header class="super-header">
          <div class="super-header__info">
            <h1 class="super-title">Назначенные мной администраторы</h1>
            <p class="super-subtitle" id="organizationMeta">Организация: —</p>
          </div>
          <div class="super-header__stats" id="superStats"></div>
        </header>

        <section class="super-block">
          <div class="super-block__head">
            <h2>Список администраторов</h2>
          </div>
          <p class="super-feedback" id="listFeedback"></p>
          <div class="super-grid" id="assignedAdminsGrid"></div>
        </section>
      </main>
    </div>

    <script src="superadmin_admins.js"></script>
  </body>
</html>
