<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSignal | Панель администратора</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@300;400;500;600&family=Roboto+Slab:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-page">
      <aside class="sidebar" id="sidebar" aria-label="Боковое меню">
        <div class="sidebar-top">
          <div class="sidebar-head">
            <button class="sidebar-brand" type="button" aria-label="EcoSignal">
              <img class="sidebar-brand-icon" src="./icons/Group.svg" alt="" />
              <span class="sidebar-brand-name">EcoSignal</span>
            </button>
            <button
              class="sidebar-nav-item1"
              id="sidebarToggle"
              type="button"
              aria-label="Развернуть панель"
              aria-expanded="false"
            >
              <img src="./icons/aside-slider.svg" alt="" />
            </button>
          </div>

          <nav class="sidebar-nav" aria-label="Навигация">
            <button
              class="sidebar-nav-item sidebar-nav-item--active"
              type="button"
              data-href="admin.html"
              aria-label="Панель администратора"
              aria-current="page"
            >
              <img src="./icons/Home.svg" alt="" />
              <span class="sidebar-nav-label">Панель администратора</span>
            </button>
            <button
              class="sidebar-nav-item"
              type="button"
              data-href="admin_my_appeals.html"
              aria-label="Мои обращения"
            >
              <img src="./icons/my_appeals.svg" alt="" />
              <span class="sidebar-nav-label">Мои обращения</span>
            </button>
            <button
              class="sidebar-nav-item"
              type="button"
              data-action="logout"
              aria-label="Выход"
            >
              <img src="./icons/logout.svg" alt="" />
              <span class="sidebar-nav-label">Выход</span>
            </button>
          </nav>
        </div>

        <button class="sidebar-profile" id="sidebarProfileButton" type="button" aria-label="Профиль">
          <span class="sidebar-avatar" id="sidebarAvatar">А</span>
          <span class="sidebar-profile-meta">
            <span class="sidebar-profile-name">Профиль</span>
            <span class="sidebar-profile-level">Администратор</span>
          </span>
        </button>
      </aside>

      <div class="admin-workspace">
        <main class="admin-content">
          <header class="admin-header">
            <h1 class="admin-title">Панель администратора</h1>
          </header>

          <section class="stats-grid" id="statsGrid" aria-label="Сводная статистика"></section>

          <section class="appeals-section" id="appealsSection" aria-label="Карточки заявок">
            <h2 class="appeals-title">Последние обращения</h2>
            <div class="appeals-grid" id="appealsGrid"></div>
          </section>
        </main>
      </div>
    </div>

    <div class="photo-lightbox" id="photoLightbox" hidden>
      <div class="photo-lightbox__backdrop" id="photoLightboxBackdrop"></div>
      <button class="photo-lightbox__close" id="photoLightboxClose" type="button" aria-label="Закрыть">&times;</button>
      <button class="photo-lightbox__nav photo-lightbox__nav--prev" id="photoLightboxPrev" type="button" aria-label="Предыдущее">&lsaquo;</button>
      <div class="photo-lightbox__stage">
        <img class="photo-lightbox__img" id="photoLightboxImg" alt="" />
      </div>
      <button class="photo-lightbox__nav photo-lightbox__nav--next" id="photoLightboxNext" type="button" aria-label="Следующее">&rsaquo;</button>
      <p class="photo-lightbox__counter" id="photoLightboxCounter" aria-live="polite"></p>
    </div>

    <div class="profile-modal" id="profileModal" hidden>
      <div class="profile-modal__backdrop" id="profileModalBackdrop"></div>
      <section class="profile-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <button class="profile-modal__close" id="profileModalClose" type="button" aria-label="Закрыть">×</button>
        <header class="profile-modal__hero">
          <div class="profile-modal__hero-copy">
            <h2 class="profile-modal__title" id="profileModalTitle">Профиль</h2>
            <p class="profile-modal__subtitle">Редактирование личных данных и контактной информации.</p>
          </div>
        </header>

        <form class="profile-modal__form" id="profileModalForm">
          <div class="profile-modal__grid">
            <label class="profile-modal__field profile-modal__field--wide">
              <span>ФИО</span>
              <input id="profileFullName" name="fullname" type="text" maxlength="201" required />
            </label>
            <label class="profile-modal__field">
              <span id="profileEmailLabel">Логин</span>
              <input id="profileEmail" name="email" type="text" maxlength="255" required />
            </label>
            <label class="profile-modal__field">
              <span>Пароль</span>
              <input id="profilePassword" name="password" type="password" maxlength="255" />
            </label>
            <label class="profile-modal__field profile-modal__field--wide">
              <span>О себе</span>
              <textarea id="profileAbout" name="about" rows="4" maxlength="1000"></textarea>
            </label>
          </div>

          <div class="profile-modal__meta">
            <div class="profile-modal__meta-item">
              <span class="profile-modal__meta-label">Роль</span>
              <strong class="profile-modal__meta-value" id="profileRole">Администратор</strong>
            </div>
            <div class="profile-modal__meta-item">
              <span class="profile-modal__meta-label">Дата регистрации</span>
              <strong class="profile-modal__meta-value" id="profileCreatedAt">—</strong>
            </div>
          </div>

          <p class="profile-modal__message" id="profileModalMessage" aria-live="polite"></p>

          <div class="profile-modal__actions">
            <button class="profile-modal__btn profile-modal__btn--primary" id="profileModalSave" type="submit">Сохранить</button>
          </div>
        </form>
      </section>
    </div>

    <script src="appeal_drawer.js"></script>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=c4b88e0d-3370-4eee-b2cd-7bb4ad66c4af&lang=ru_RU"></script>
    <script src="admin.js"></script>
  </body>
</html>
