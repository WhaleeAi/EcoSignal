<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>EcoSignal | Регистрация</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto+Flex:wght@300;400;600&family=Roboto+Slab:wght@300;400&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body class="register-page">
		<header class="site-header">
			<nav class="navbar header-container">
				<a class="logo" href="index.html">
					<img class="logo-image" src="icons/Group.svg" alt="EcoSignal" />
					EcoSignal
				</a>
				<ul class="nav-links">
					<li><a href="index.html#about">О проекте</a></li>
					<li><a href="index.html#how-it-works">Как это работает</a></li>
					<li><a href="index.html#roles">Для кого</a></li>
					<li><a href="index.html#contacts">Контакты</a></li>
					<li><a href="map.html">Карта</a></li>
				</ul>
				<div class="nav-actions" id="navActions">
					<a class="btn btn-login" href="login.html">Войти</a>
				</div>
			</nav>
		</header>

		<main class="register-main">
			<section class="register-layout">
				<section class="register-left">
					<div class="register-inner">
						<h1 class="register-title">Регистрация</h1>

						<div class="register-card">
							<form class="register-form" id="registerForm" autocomplete="off">
								<input id="fullname" name="fullname" type="text" placeholder="ФИО" required />
								<input id="email" name="email" type="email" placeholder="Введите email" required />
								<input
									id="password"
									name="new_password"
									type="password"
									autocomplete="new-password"
									data-lpignore="true"
									data-1p-ignore="true"
									placeholder="Создайте пароль"
									required
								/>

								<label class="register-consent">
									<input id="personalDataConsent" type="checkbox" required />
									<span>
										Я даю согласие на обработку персональных данных и ознакомлен(а) с
										<a href="privacy.html" target="_blank" rel="noopener">политикой обработки персональных данных</a>.
									</span>
								</label>

								<button type="submit" class="submit-btn" id="registerSubmit" disabled>Продолжить</button>
							</form>

							<p id="message"></p>
						</div>
					</div>
				</section>

				<aside class="register-right">
					<img class="register-illustration" src="imgs/reg_illustration.png" alt="Иллюстрация регистрации" />
				</aside>
			</section>
		</main>

		<script>
			function getDashboardUrl(user) {
				const userRole = user?.role
				const authSource = user?.auth_source

				if (userRole === 'superadmin' && authSource === 'system_admins') {
					return 'superadmin.html'
				}

				if (userRole === 'global_admin' && authSource === 'system_admins') {
					return 'global_admin.html'
				}

				if (userRole === 'ai_admin' && authSource === 'system_admins') {
					return 'ai_admin.html'
				}

				if (userRole === 'admin' && authSource === 'org_admins') {
					return 'agent.html'
				}

				return 'map.html'
			}

			async function syncHeaderAuthAction() {
				const navActions = document.getElementById('navActions')
				const token = localStorage.getItem('token')
				if (!navActions || !token) return

				try {
					const response = await fetch('api/auth/me', {
						method: 'GET',
						headers: {
							Authorization: `Bearer ${token}`,
						},
					})

					if (!response.ok) {
						localStorage.removeItem('token')
						localStorage.removeItem('user')
						return
					}

					const data = await response.json()
					navActions.innerHTML = `<a class="btn btn-login" href="${getDashboardUrl(data?.user)}">Личный кабинет</a>`
				} catch (error) {
					localStorage.removeItem('token')
					localStorage.removeItem('user')
				}
			}

			syncHeaderAuthAction()

			const passwordInput = document.getElementById('password')
			const consentInput = document.getElementById('personalDataConsent')
			const submitButton = document.getElementById('registerSubmit')

			const clearPasswordInput = () => {
				if (passwordInput) passwordInput.value = ''
			}

			const syncSubmitState = () => {
				submitButton.disabled = !consentInput.checked
			}

			clearPasswordInput()
			syncSubmitState()
			consentInput.addEventListener('change', syncSubmitState)
			window.addEventListener('pageshow', clearPasswordInput)
			window.setTimeout(clearPasswordInput, 250)

			document.getElementById('registerForm').addEventListener('submit', async event => {
				event.preventDefault()

				const fullname = document.getElementById('fullname').value.trim()
				const email = document.getElementById('email').value.trim()
				const password = document.getElementById('password').value.trim()
				const role = 'citizen'
				const messageEl = document.getElementById('message')

				if (!consentInput.checked) {
					messageEl.textContent = 'Для регистрации необходимо согласие на обработку персональных данных'
					return
				}

				try {
					const response = await fetch('api/auth/register', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
						},
						body: JSON.stringify({ fullname, email, password, role }),
					})

					const data = await response.json()

					if (!response.ok) {
						messageEl.textContent = data.message || 'Ошибка регистрации'
						return
					}

					messageEl.textContent = data.message

					if (data?.requires_approval) {
						localStorage.removeItem('token')
						localStorage.removeItem('user')
						setTimeout(() => {
							window.location.href = 'login.html'
						}, 1400)
						return
					}

					localStorage.setItem('token', data.token)
					localStorage.setItem('user', JSON.stringify(data.user))

					const userRole = data?.user?.role
					const authSource = data?.user?.auth_source
					const nextPage = getDashboardUrl({ role: userRole, auth_source: authSource })
					setTimeout(() => {
						window.location.href = nextPage
					}, 1000)
				} catch (error) {
					messageEl.textContent = 'Ошибка соединения с сервером'
				}
			})
		</script>
	</body>
</html>
