<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>EcoSignal | Регистрация</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto+Flex:wght@300;400;600&family=Roboto+Slab:wght@300;400&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body class="register-page">
		<header class="site-header">
			<nav class="navbar header-container">
				<a class="logo" href="index.html">
					<img class="logo-image" src="icons/Group.svg" alt="EcoSignal" />
					EcoSignal
				</a>
				<ul class="nav-links">
					<li><a href="index.html#about">О проекте</a></li>
					<li><a href="index.html#how-it-works">Как это работает</a></li>
					<li><a href="index.html#roles">Для кого</a></li>
					<li><a href="index.html#contacts">Контакты</a></li>
					<li><a href="map.html">Карта</a></li>
				</ul>
				<div class="nav-actions" id="navActions">
					<a class="btn btn-login" href="login.html">Войти</a>
				</div>
			</nav>
		</header>

		<main class="register-main">
			<section class="register-layout">
				<section class="register-left">
					<div class="register-inner">
						<h1 class="register-title">Регистрация</h1>

						<div class="register-card">
							<form class="register-form" id="registerForm" autocomplete="off">
								<input
									id="fullname"
									name="fullname"
									type="text"
									placeholder="ФИО"
								/>
								<input
									id="email"
									name="email"
									type="email"
									placeholder="Введите email"
								/>
								<input
									id="password"
									name="new_password"
									type="password"
									autocomplete="new-password"
									data-lpignore="true"
									data-1p-ignore="true"
									placeholder="Создайте пароль"
								/>

								<div class="role-dropdown" data-dropdown>
									<input type="hidden" id="role" name="role" value="" />
									<button
										class="role-trigger"
										type="button"
										data-trigger
										aria-haspopup="listbox"
										aria-expanded="false"
									>
										<span data-label>Выберите роль</span>
										<span class="role-caret" aria-hidden="true"></span>
									</button>
									<div class="role-menu" data-menu role="listbox">
										<button
											type="button"
											class="role-option"
											data-value="citizen"
										>
											Гражданин
										</button>
										<button
											type="button"
											class="role-option"
											data-value="agency"
										>
											Орган надзора
										</button>
									</div>
								</div>

								<button type="submit" class="submit-btn">Продолжить</button>
							</form>

							<p id="message"></p>
							<p class="register-note">
								Нажимая «Продолжить», вы принимаете условия использования
								сервиса EcoSignal.
							</p>
						</div>
					</div>
				</section>

				<aside class="register-right">
					<img
						class="register-illustration"
						src="imgs/reg_illustration.png"
						alt="Иллюстрация регистрации"
					/>
				</aside>
			</section>
		</main>

		<script>
			;(() => {
				const dropdown = document.querySelector('[data-dropdown]')
				if (!dropdown) return

				const trigger = dropdown.querySelector('[data-trigger]')
				const menu = dropdown.querySelector('[data-menu]')
				const label = dropdown.querySelector('[data-label]')
				const hidden = dropdown.querySelector("input[type='hidden']")
				const options = dropdown.querySelectorAll('.role-option')

				const close = () => {
					dropdown.classList.remove('open')
					trigger.setAttribute('aria-expanded', 'false')
				}

				const open = () => {
					dropdown.classList.add('open')
					trigger.setAttribute('aria-expanded', 'true')
				}

				trigger.addEventListener('click', () => {
					dropdown.classList.contains('open') ? close() : open()
				})

				options.forEach(option => {
					option.addEventListener('click', () => {
						hidden.value = option.dataset.value || ''
						label.textContent = option.textContent || 'Выберите роль'
						close()
					})
				})

				document.addEventListener('click', event => {
					if (!dropdown.contains(event.target)) close()
				})

				document.addEventListener('keydown', event => {
					if (event.key === 'Escape') close()
				})
			})()

			function getDashboardUrl(user) {
				const userRole = user?.role
				const authSource = user?.auth_source

				if (userRole === 'superadmin' && authSource === 'superadmins') {
					return 'superadmin.html'
				}

				if (userRole === 'admin') {
					return authSource === 'org_admins' ? 'agent.html' : 'map.html'
				}

				return 'map.html'
			}

			async function syncHeaderAuthAction() {
				const navActions = document.getElementById('navActions')
				const token = localStorage.getItem('token')
				if (!navActions || !token) return

				try {
					const response = await fetch('backend/me.php', {
						method: 'GET',
						headers: {
							Authorization: `Bearer ${token}`,
						},
					})

					if (!response.ok) {
						localStorage.removeItem('token')
						localStorage.removeItem('user')
						return
					}

					const data = await response.json()
					navActions.innerHTML = `<a class="btn btn-login" href="${getDashboardUrl(data?.user)}">Личный кабинет</a>`
				} catch (error) {
					localStorage.removeItem('token')
					localStorage.removeItem('user')
				}
			}

			syncHeaderAuthAction()

			const passwordInput = document.getElementById('password')
			const clearPasswordInput = () => {
				if (passwordInput) passwordInput.value = ''
			}

			clearPasswordInput()
			window.addEventListener('pageshow', clearPasswordInput)
			window.setTimeout(clearPasswordInput, 250)

			document
				.getElementById('registerForm')
				.addEventListener('submit', async event => {
					event.preventDefault()

					const fullname = document.getElementById('fullname').value.trim()
					const email = document.getElementById('email').value.trim()
					const password = document.getElementById('password').value.trim()
					const role = document.getElementById('role').value.trim()
					const messageEl = document.getElementById('message')

					try {
						const response = await fetch('backend/register.php', {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json',
							},
							body: JSON.stringify({ fullname, email, password, role }),
						})

						const data = await response.json()

						if (!response.ok) {
							messageEl.textContent = data.message || 'Ошибка регистрации'
							return
						}

						messageEl.textContent = data.message

						if (data?.requires_approval) {
							localStorage.removeItem('token')
							localStorage.removeItem('user')
							setTimeout(() => {
								window.location.href = 'login.html'
							}, 1400)
							return
						}

						localStorage.setItem('token', data.token)
						localStorage.setItem('user', JSON.stringify(data.user))

						const userRole = data?.user?.role
						const nextPage = getDashboardUrl({ role: userRole })
						setTimeout(() => {
							window.location.href = nextPage
						}, 1000)
					} catch (error) {
						messageEl.textContent = 'Ошибка соединения с сервером'
					}
				})
		</script>
	</body>
</html>
