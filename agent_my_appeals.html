<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSignal | Заявки агента</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@300;400;500;600&family=Roboto+Slab:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="agent.css" />
  </head>
  <body>
    <div class="admin-page">
      <aside class="sidebar" id="sidebar" aria-label="Боковое меню">
        <div class="sidebar-top">
          <div class="sidebar-head">
            <button class="sidebar-brand" type="button" aria-label="EcoSignal">
              <img class="sidebar-brand-icon" src="./icons/Group.svg" alt="" />
              <span class="sidebar-brand-name">EcoSignal</span>
            </button>
            <button
              class="sidebar-nav-item1"
              id="sidebarToggle"
              type="button"
              aria-label="Развернуть панель"
              aria-expanded="false"
            >
              <img src="./icons/aside-slider.svg" alt="" />
            </button>
          </div>

          <nav class="sidebar-nav" aria-label="Навигация">
            <button class="sidebar-nav-item" type="button" data-href="agent.html">
              <img src="./icons/Home.svg" alt="" />
              <span class="sidebar-nav-label">Главная</span>
            </button>
            <button
              class="sidebar-nav-item sidebar-nav-item--active"
              type="button"
              data-href="agent_my_appeals.html"
              aria-current="page"
            >
              <img src="./icons/my_appeals.svg" alt="" />
              <span class="sidebar-nav-label">Заявки</span>
            </button>
            <button class="sidebar-nav-item" type="button" data-action="logout">
              <img src="./icons/logout.svg" alt="" />
              <span class="sidebar-nav-label">Выход</span>
            </button>
          </nav>
        </div>

        <button class="sidebar-profile" type="button" aria-label="Профиль">
          <span class="sidebar-avatar" id="sidebarAvatar">А</span>
          <span class="sidebar-profile-meta">
            <span class="sidebar-profile-name" id="sidebarProfileName">Профиль</span>
            <span class="sidebar-profile-level" id="sidebarProfileLevel">Агент</span>
          </span>
          <img class="sidebar-profile-arrow" aria-hidden="true" src="./icons/arrow_down.svg" />
        </button>
      </aside>

      <div class="admin-workspace">
        <main class="admin-content agent-content">
          <header class="agent-header">
            <div class="agent-header__copy">
              <h1 class="admin-title">Заявки агента</h1>
              <p class="agent-subtitle" id="organizationMeta">Организация: —</p>
            </div>
          </header>

          <section class="appeals-section" id="appealsSection" aria-label="Заявки агента">
            <h2 class="appeals-title">В работе и завершённые</h2>
            <p class="appeals-intro">
              Все заявки, назначенные текущему агенту, со статусами кроме pending. Карточки и сетка совпадают с
              admin_my_appeals.
            </p>
            <div class="appeals-grid" id="appealsGrid"></div>
          </section>
        </main>
      </div>
    </div>

    <div class="photo-lightbox" id="photoLightbox" hidden>
      <div class="photo-lightbox__backdrop" id="photoLightboxBackdrop"></div>
      <button class="photo-lightbox__close" id="photoLightboxClose" type="button" aria-label="Закрыть">×</button>
      <button class="photo-lightbox__nav photo-lightbox__nav--prev" id="photoLightboxPrev" type="button" aria-label="Предыдущее">‹</button>
      <div class="photo-lightbox__stage">
        <img class="photo-lightbox__img" id="photoLightboxImg" alt="" />
      </div>
      <button class="photo-lightbox__nav photo-lightbox__nav--next" id="photoLightboxNext" type="button" aria-label="Следующее">›</button>
      <p class="photo-lightbox__counter" id="photoLightboxCounter" aria-live="polite"></p>
    </div>

    <script src="agent_appeal_drawers.js"></script>
    <script src="agent_my_appeals.js"></script>
  </body>
</html>
